<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Evaluación práctica de Python · Grado 11</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: white;
            color: black;
            font-family: Arial, sans-serif;
        }

        .pagina {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin: 0 0 8px;
            text-align: center;
            font-size: 26px;
        }

        h2 {
            margin-top: 30px;
            font-size: 25px;
        }

        h3 {
            margin-top: 26px;
        }

        .subtitulo {
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .datos {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin: 25px 0;
        }

        label {
            display: block;
        }

        input,
        select,
        textarea,
        button {
            font: inherit;
        }

        input[type="text"],
        select {
            width: 100%;
            margin-top: 6px;
            padding: 10px;
            border: 1px solid black;
            background: white;
        }

        button {
            padding: 11px 20px;
            border: 1px solid black;
            background: white;
            cursor: pointer;
        }

        button:hover:not(:disabled) {
            background: #eeeeee;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .acciones {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 20px 0;
        }

        .instrucciones {
            line-height: 1.5;
        }

        .evaluacion {
            display: none;
        }

        .barra-evaluacion {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            border-top: 1px solid black;
            border-bottom: 1px solid black;
            padding: 12px 0;
            margin: 22px 0;
        }

        .temporizador {
            font-size: 24px;
            font-weight: bold;
            white-space: nowrap;
        }

        .tiempo-alerta {
            color: #a00000;
        }

        .situacion-problema {
            font-size: 18px;
            line-height: 1.55;
        }

        .requisitos {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px 30px;
            margin-bottom: 25px;
        }

        .requisito::before {
            content: "□ ";
        }

        .codigo {
            width: 100%;
            min-height: 370px;
            padding: 14px;
            border: 1px solid black;
            resize: vertical;
            font-family: Consolas, "Courier New", monospace;
            font-size: 16px;
            line-height: 1.55;
            tab-size: 4;
        }

        .estado-editor {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 6px;
            font-size: 14px;
        }

        .resultado {
            width: 100%;
            min-height: 90px;
            padding: 10px;
            border: 1px solid black;
            resize: vertical;
        }

        .mensaje {
            display: none;
            margin: 18px 0;
            padding: 14px;
            border: 2px solid black;
            font-weight: bold;
        }

        .aviso {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.45;
        }

        .oculto {
            display: none;
        }

        @media (max-width: 700px) {
            body {
                padding: 18px;
            }

            .datos,
            .requisitos {
                grid-template-columns: 1fr;
            }

            .barra-evaluacion {
                display: block;
            }

            .temporizador {
                margin-top: 12px;
            }
        }

        @media print {
            button,
            .aviso {
                display: none;
            }

            body {
                padding: 0;
            }
        }
    </style>
</head>

<body>

<div class="pagina">

    <h1>EVALUACIÓN PRÁCTICA DE PYTHON · GRADO 11</h1>

    <div class="subtitulo">
        Operadores y condicionales
    </div>

    <section id="identificacion">

        <p class="instrucciones">
            Escribe tu nombre completo y selecciona tu curso.
            La situación se asignará automáticamente y permanecerá
            vinculada a esos datos.
        </p>

        <div class="datos">

            <label>
                <strong>Nombre completo:</strong>

                <input
                    id="nombre"
                    type="text"
                    autocomplete="off"
                    maxlength="80"
                    placeholder="Escribe nombre y apellido"
                >
            </label>

            <label>
                <strong>Curso:</strong>

                <select id="curso">
                    <option value="">Selecciona</option>
                    <option value="11A">11A</option>
                    <option value="11B">11B</option>
                    <option value="11C">11C</option>
                </select>
            </label>

        </div>

        <div class="acciones">
            <button
                id="botonComenzar"
                type="button"
            >
                Comenzar evaluación
            </button>

            <button
                id="botonReiniciar"
                class="oculto"
                type="button"
            >
                Reiniciar intento
            </button>
        </div>

        <div
            id="mensajeInicial"
            class="mensaje"
        ></div>

    </section>

    <section
        id="evaluacion"
        class="evaluacion"
    >

        <div class="barra-evaluacion">

            <div>
                <div>
                    <strong id="estudianteAsignado"></strong>
                </div>

                <div id="datosAsignacion"></div>
            </div>

            <div
                id="temporizador"
